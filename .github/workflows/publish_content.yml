name: Zero-Cost AI Automated Publishing

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Execute Autonomous Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: |
          python main.py

      - name: Commit and Push New Posts Back to GitHub
        run: |
          git config --global user.name "AI-Publisher-Bot"
          git config --global user.email "actions@github.com"
          git add posts/
          git commit -m "auto: publish monetized article [skip ci]" || exit 0
          git pull --rebase origin main
          git push
